# ─── CloudHorus CI Pipeline ───
# Runs on every PR and push to main/develop.
# Pipeline: lint → build + security
# The Release workflow requires this to pass before publishing.
#
# Pipeline:
#   ┌─ lint ────────────────────────────────────────────────────────┐
#   │  black, isort, mypy, version consistency                     │
#   └──────────────────────┬────────────────────────────────────────┘
#                          │
#   ┌──────────────────────┼────────────────────────────────────────┐
#   │  build + security    ▼                                        │
#   │  sdist, wheel, twine check, pip-audit                         │
#   └───────────────────────────────────────────────────────────────┘

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_call:        # allow Release workflow to invoke CI as a reusable gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write    # for coverage comment

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Code Quality — fast fail before expensive test matrix
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check --diff src/ tests/

      - name: Check import order (isort)
        run: isort --check --diff src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Version consistency check
        run: |
          PY_VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('src/version.py').read_text()
          m = re.search(r\"__version__\s*=\s*['\\\"]([^'\\\"]+)['\\\"]\", text)
          print(m.group(1) if m else 'MISSING')
          ")
          TOML_VER=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.M)
          print(m.group(1) if m else 'MISSING')
          ")
          echo "version.py:     $PY_VER"
          echo "pyproject.toml: $TOML_VER"
          if [ "$PY_VER" != "$TOML_VER" ]; then
            echo "::error::Version mismatch: version.py=$PY_VER vs pyproject.toml=$TOML_VER"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # 2. Build — verify the package builds cleanly
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build sdist & wheel
        run: python -m build

      - name: Verify distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 3. Security — dependency vulnerability scan
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Dependency Scan
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install system dependencies (pygraphviz needs libgraphviz-dev)
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev

      - name: Install project dependencies
        run: pip install -e ".[all]"

      - name: Audit dependencies
        run: pip-audit --strict --desc --skip-editable
        continue-on-error: true   # advisory — don't block PRs on upstream CVEs
