[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudhorus"
version = "1.3.1"
description = "Azure Cloud Architecture Visualizer — Soar above your cloud complexity"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hicham Fellah"},
]
keywords = ["azure", "visualization", "graph", "diagram", "architecture", "cloud", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Visualization",
    "Topic :: System :: Systems Administration",
    "Operating System :: OS Independent",
]
dependencies = [
    "graphviz>=0.20",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "Pillow>=9.0.0",
    "python-hcl2>=8.1.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-network>=23.0.0",
    "azure-mgmt-subscription>=3.0.0",
    "azure-core>=1.28.0",
]
export = [
    "graphviz2drawio>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "mypy>=1.3.0",
    "pre-commit>=3.6.0",
]
all = ["cloudhorus[azure,export,dev]"]

[project.urls]
Homepage = "https://github.com/CloudHorus/CloudHorus"
Documentation = "https://github.com/CloudHorus/CloudHorus#readme"
Repository = "https://github.com/CloudHorus/CloudHorus"
"Bug Tracker" = "https://github.com/CloudHorus/CloudHorus/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["icons/*.png"]

# ── pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "performance: timing benchmarks; deselect with -m 'not performance'",
]

# ── black ───────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py39"]

# ── isort ───────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["cloudhorus", "core", "utils"]

# ── mypy ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
